name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Scan test sources for accidental real external host usage
        # Automated tests must never contact a real external host (OpenAI,
        # Nordstrom, weather/geocoding providers). This is a static,
        # best-effort check (grep, not runtime network monitoring) for the
        # one pattern that would actually route a client at a real host:
        # an HTTP client base URL literal pointed at one of them. See
        # backend/src/test/resources/application-test.yml and
        # com.stylecast.testsupport.NoExternalNetworkGuardConfig for the
        # runtime-side guarantees.
        run: |
          set -e
          if grep -RnE '\.baseUrl\("https://(api\.openai\.com|([a-zA-Z0-9.-]*\.)?nordstrom(media)?\.com|([a-zA-Z0-9.-]*\.)?open-meteo\.com)' backend/src/test/java; then
            echo "::error::Test code appears to configure a real external base URL - tests must only ever target localhost/127.0.0.1/::1." >&2
            exit 1
          fi
          if [ ! -f backend/src/test/resources/application-test.yml ]; then
            echo "::error::backend/src/test/resources/application-test.yml is missing - the test profile with safe, local-only defaults must exist." >&2
            exit 1
          fi
          echo "No real external host base URLs found in backend test sources; test profile present."

      - name: Run backend tests
        working-directory: backend
        # No OPENAI_API_KEY (or any other external credential) is set for
        # this job - tests must never require one. Automated tests use
        # mocked providers and local fixtures only (see
        # src/test/resources/application-test.yml).
        run: ./mvnw -B test

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Scan test sources for accidental real external fetch targets
        run: |
          set -e
          if grep -RnE "fetch\(\s*['\"]https?://" frontend/src | grep -viE "localhost|127\.0\.0\.1|::1"; then
            echo "::error::Frontend test/source code appears to call fetch() with a real absolute external URL - all API calls must be relative (/api/...) and mocked in tests." >&2
            exit 1
          fi
          echo "No real external fetch() targets found in frontend source."

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        # Every test file stubs global fetch (vi.stubGlobal('fetch', vi.fn()))
        # - no real network access is made or required.
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local .env file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend image
        run: docker build -t stylecast-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t stylecast-frontend:ci ./frontend

  compose-integration:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    needs:
      - docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local .env file
        run: cp .env.example .env

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail -s http://localhost:8080/api/health; then
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 5
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Test backend health endpoint
        run: curl --fail -s http://localhost:8080/api/health

      - name: Test frontend
        run: curl --fail -s http://localhost:3000/ >/dev/null

      - name: Test frontend-to-backend proxy
        run: curl --fail -s http://localhost:3000/api/health

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers and volumes
        if: always()
        run: docker compose down -v

name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local .env file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend image
        run: docker build -t stylecast-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t stylecast-frontend:ci ./frontend

  compose-integration:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    needs:
      - docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local .env file
        run: cp .env.example .env

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail -s http://localhost:8080/api/health; then
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 5
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Test backend health endpoint
        run: curl --fail -s http://localhost:8080/api/health

      - name: Test frontend
        run: curl --fail -s http://localhost:3000/ >/dev/null

      - name: Test frontend-to-backend proxy
        run: curl --fail -s http://localhost:3000/api/health

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers and volumes
        if: always()
        run: docker compose down -v

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend Compose service. "backend" is the
    # Docker Compose service name, resolved via Docker's internal DNS -
    # never use "localhost" here, since Nginx and the backend run in
    # separate containers.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: serve index.html for any route that isn't a real file,
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

spring:
  application:
    name: stylecast-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

stylecast:
  retail-search:
    # No default value - the app must start fine without this set (Task 4B
    # requirement). OpenAiNordstromProductSearchProvider returns a clear
    # ProductSearchProviderException (mapped to HTTP 503) when it is blank.
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_RETAIL_SEARCH_MODEL:gpt-4.1}
    base-url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
    connect-timeout-ms: ${RETAIL_SEARCH_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RETAIL_SEARCH_READ_TIMEOUT_MS:15000}
    max-result-limit: ${RETAIL_SEARCH_MAX_RESULTS:25}
  occasion-classifier:
    # Reuses OPENAI_API_KEY / OPENAI_API_BASE_URL (same OpenAI account as
    # retail-search above). No default API key - the app must start fine
    # without this set; OccasionInterpretationService falls back to
    # RuleBasedOccasionClassifier whenever OpenAiOccasionClassifier throws
    # (including a blank key), so classification always succeeds either way.
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OCCASION_CLASSIFIER_MODEL:gpt-4.1}
    base-url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
    connect-timeout-ms: ${OCCASION_CLASSIFIER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OCCASION_CLASSIFIER_READ_TIMEOUT_MS:15000}
  weather:
    # Open-Meteo (https://open-meteo.com) requires no API key, so event-time
    # weather works out of the box with no extra secrets. Base URLs are
    # overridden in tests to point at a local fake HTTP server instead.
    geocoding-base-url: ${WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
    forecast-base-url: ${WEATHER_FORECAST_BASE_URL:https://api.open-meteo.com}
    connect-timeout-ms: ${WEATHER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${WEATHER_READ_TIMEOUT_MS:10000}
    forecast-horizon-days: ${WEATHER_FORECAST_HORIZON_DAYS:16}
    # How long a saved snapshot is trusted before GET /weather transparently
    # refreshes it (default 3 hours).
    freshness-minutes: ${WEATHER_FRESHNESS_MINUTES:180}
    provider-name: OPEN_METEO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stylecast}
      POSTGRES_USER: ${DB_USER:-stylecast}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stylecast}
    ports:
      # Host port 5433 maps to Postgres' standard internal port 5432, so it
      # doesn't collide with a Postgres instance already running locally.
      - "5433:5432"
    volumes:
      - stylecast_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stylecast} -d ${DB_NAME:-stylecast}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-stylecast}
      DB_USER: ${DB_USER:-stylecast}
      DB_PASSWORD: ${DB_PASSWORD:-stylecast}
      # Optional - only required to use the temporary development endpoint
      # POST /api/dev/retail-products/search. The app starts and runs
      # normally without it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional model overrides for the two OpenAI-backed features (live
      # Nordstrom search/product-detail enrichment and occasion
      # classification) - default to gpt-4.1 via application.yml when
      # unset, so these are only needed to override that default.
      OPENAI_RETAIL_SEARCH_MODEL: ${OPENAI_RETAIL_SEARCH_MODEL:-gpt-4.1}
      OCCASION_CLASSIFIER_MODEL: ${OCCASION_CLASSIFIER_MODEL:-gpt-4.1}
      # Optional timeout overrides for the retail-search/product-detail-
      # enrichment OpenAI calls - default via application.yml (connect 5s,
      # read 60s, since a real web-search response can involve several
      # internal reasoning/web_search_call steps before the final message).
      RETAIL_SEARCH_CONNECT_TIMEOUT_MS: ${RETAIL_SEARCH_CONNECT_TIMEOUT_MS:-5000}
      RETAIL_SEARCH_READ_TIMEOUT_MS: ${RETAIL_SEARCH_READ_TIMEOUT_MS:-60000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  stylecast_postgres_data:
